name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
      - name: Focused model and behavioral revert proofs without inherited credentials
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { chmodSync, mkdtempSync, readdirSync, rmSync } from "node:fs";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          const lifecycleHome = mkdtempSync(join(tmpdir(), "pm-lifecycle-ci-"));
          const childEnv = { PATH: process.env.PATH, HOME: lifecycleHome, NPM_CONFIG_USERCONFIG: "/dev/null", GIT_CONFIG_GLOBAL: "/dev/null", GIT_CONFIG_NOSYSTEM: "1", GIT_CEILING_DIRECTORIES: tmpdir(), PM_AUTHOR: "codex-agent", DO_NOT_TRACK: "1" };
          const run = (binary, args) => execFileSync(binary, args, { env: childEnv, stdio: "inherit" });
          run("npm", ["ci", "--ignore-scripts"]);
          run("npm", ["run", "build"]);
          run("npm", ["run", "build:test"]);
          run("npm", ["run", "docstring"]);
          run(process.execPath, ["node_modules/@unbrained/pm-cli/dist/cli.js", "test", "pmc-release-corrections", "--run", "--only-last", "--progress", "--allow-untrusted-linked-tests", "--timeout", "1200"]);
          run(process.execPath, ["node_modules/@unbrained/pm-cli/dist/cli.js", "test", "pmc-milestone-status-roles", "--run", "--only-last", "--progress", "--allow-untrusted-linked-tests", "--timeout", "240"]);
          run(process.execPath, ["--test", "--test-concurrency=2", "test/closure-status-roles.test.ts", "test/release-publication.test.ts", "test/release-ownership.test.ts"]);
          run(process.execPath, ["scripts/verify-release-lifecycles.ts"]);
          run(process.execPath, ["scripts/accept-release-corrections.ts"]);
          run("npm", ["run", "changelog:full"]);
          run("npm", ["run", "changelog:check"]);
          const publicCopy = mkdtempSync(join(tmpdir(), "pm-public-tracker-"));
          const archive = execFileSync("git", ["archive", "origin/main", ".agents/pm"], { env: childEnv, maxBuffer: 64 * 1024 * 1024 });
          execFileSync("tar", ["-xf", "-", "-C", publicCopy], { input: archive, env: childEnv });
          const source = join(publicCopy, ".agents/pm");
          const mode = (directory, readOnly) => {
            chmodSync(directory, readOnly ? 0o555 : 0o700);
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              if (entry.isDirectory()) mode(path, readOnly);
              else if (entry.isFile()) chmodSync(path, readOnly ? 0o444 : 0o600);
              else throw new Error("Public tracker source must contain regular files only");
            }
          };
          try {
            mode(source, true);
            run(process.execPath, ["scripts/validate-release-corrections.ts", source]);
          } finally { mode(source, false); rmSync(publicCopy, { recursive: true, force: true }); }
          NODE

  test:
    needs: lifecycle
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked pm project health
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # pm-cli 2026.8.11 correctly detects 32 immutable role="1" events written
          # before its Claude role resolver was repaired, but it has no disposition
          # path yet and classifies that known legacy aggregate as blocking. Keep an
          # exact fail-closed baseline here: a changed count, a different provenance
          # finding, or any other non-advisory warning still fails this gate.
          health_json="$(./node_modules/.bin/pm health --json --require-merge-drivers || true)"
          printf '%s\n' "$health_json"
          printf '%s\n' "$health_json" | jq -e '
            def advisory:
              startswith("telemetry_") or
              startswith("history_stream_over_compact_threshold:") or
              startswith("stale_in_progress_items:") or
              startswith("provenance_resolver_zero_success:") or
              . == "provenance_value_domain_invalid:claude-code:role:single_digit:32";
            ([.warnings[] | select(advisory | not)] | length) == 0 and
            ([.warnings[] | select(startswith("provenance_value_domain_invalid:"))] ==
              ["provenance_value_domain_invalid:claude-code:role:single_digit:32"])
          '

      - name: Full release gate under npm
        run: npm run release:check

      - name: Release gate with Bun script runner
        run: bun run release:check

      - name: Direct Bun CLI and SDK runtime smoke
        run: bun test/bun-milestones-smoke.ts
