name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Same PR grouping as the local-runner pilot (#254); manual runs stay independent.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Required checks stay on fast GitHub-hosted hardware.
    runs-on: ubuntu-latest
    # Measured quick execution: Node 22 4m51s, Node 26 8m18s.
    # About three times those durations; hung jobs must release hosted slots.
    timeout-minutes: ${{ matrix.node-version == 22 && 15 || 25 }}
    env:
      PM_TEST_DEPTH: quick
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      # Checkout must precede this first decision. NUL delimiters handle unusual
      # filenames; compare the actual PR endpoints, not the synthetic merge commit.
      # Disable rename folding so moving source into docs still counts its deletion.
      - name: Detect code changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          code=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            code=false
            git diff --name-only --no-renames -z "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/ci-changed-paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                # Executable tracker files use the same code tier in every package.
                .agents/pm/*.mjs|.agents/pm/*.cjs|.agents/pm/*.js|.agents/pm/*.ts) code=true ;;
                .agents/pm/*|*.md|docs/*|CHANGELOG.md|LICENSE) ;;
                *) code=true ;;
              esac
            done < "$RUNNER_TEMP/ci-changed-paths"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        if: steps.changes.outputs.code == 'true'
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked pm project health
        if: steps.changes.outputs.code != 'true' || matrix.node-version == 26
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # pm-cli 2026.8.11 correctly detects 32 immutable role="1" events written
          # before its Claude role resolver was repaired, but it has no disposition
          # path yet and classifies that known legacy aggregate as blocking. Keep an
          # exact fail-closed baseline here: a changed count, a different provenance
          # finding, or any other non-advisory warning still fails this gate.
          health_status=0
          health_json="$(./node_modules/.bin/pm health --strict-exit --json --require-merge-drivers)" || health_status=$?
          test "$health_status" -le 1
          printf '%s\n' "$health_json"
          printf '%s\n' "$health_json" | jq -e '
            def advisory:
              startswith("telemetry_") or
              startswith("history_stream_over_compact_threshold:") or
              startswith("stale_in_progress_items:") or
              startswith("provenance_resolver_zero_success:") or
              . == "provenance_value_domain_invalid:claude-code:role:single_digit:32";
            ([.warnings[] | select(advisory | not)] | length) == 0 and
            ([.warnings[] | select(startswith("provenance_value_domain_invalid:"))] ==
              ["provenance_value_domain_invalid:claude-code:role:single_digit:32"])
          '

      - name: Check documentation and tracker changes
        if: steps.changes.outputs.code != 'true'
        run: |
          npm run changelog:check
          npm run build
          node --test test/identity-audit.test.ts test/shipped-docs.test.ts
          npm run pack:dry-run
          npm run pack:scan
          npm run verify:release-changelog-date
          npm run verify:release-publish-attestation

      - name: Engines floor tests
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 22
        run: npm test

      - name: Quick npm release gate
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: npm run release:check

      - name: Committed dist matches a fresh build
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: |
          stale=$(git status --porcelain --untracked-files=all -- dist)
          if [ -n "$stale" ]; then printf '%s\n' "$stale"; echo "::error::dist/ differs from a fresh build"; exit 1; fi

      # Full npm/Bun project/global/npx/bunx acceptance lives in deep lifecycle.
      - name: Bun and bunx packed smoke
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: node scripts/bun-packed-smoke.ts

      - name: Direct Bun CLI and SDK runtime smoke
        if: steps.changes.outputs.code == 'true' && matrix.node-version == 26
        run: bun test/bun-milestones-smoke.ts
