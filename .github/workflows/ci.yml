name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor declared in `engines` and the first line that strips
        # TypeScript without a flag; 26 is what the fleet develops against.
        node-version: [22, 26]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked pm project health
        shell: bash
        run: |
          set -euo pipefail
          # Catch durable checkout-visible failures: conflict markers, parse failures,
          # invalid or drifted history, tracked runtime caches, extension health,
          # stale in-progress work, and any merge evidence present in this clone.
          #
          # This is not a lossless-merge attestation. Merge receipts are clone-local and
          # absent from a fresh CI checkout. Some unreconciled loss shapes surface as
          # history drift, but reconciliation or history repair can remove that signal.
          # Keep receipt review as a local pre-push step; pm-cli#921 and pm-cli#922 track
          # the missing durable proof.
          #
          # pm-cli 2026.8.11 correctly detects 32 immutable role="1" events written
          # before its Claude role resolver was repaired, but it has no disposition
          # path yet and classifies that known legacy aggregate as blocking. Keep an
          # exact fail-closed baseline here: a changed count, a different provenance
          # finding, or any other non-advisory warning still fails this gate.
          health_json="$(./node_modules/.bin/pm health --json || true)"
          printf '%s\n' "$health_json"
          printf '%s\n' "$health_json" | jq -e '
            def advisory:
              startswith("telemetry_") or
              startswith("history_stream_over_compact_threshold:") or
              startswith("stale_in_progress_items:") or
              startswith("provenance_resolver_zero_success:") or
              startswith("merge_driver_configuration_missing:") or
              . == "provenance_value_domain_invalid:claude-code:role:single_digit:32";
            ([.warnings[] | select(advisory | not)] | length) == 0 and
            ([.warnings[] | select(startswith("provenance_value_domain_invalid:"))] ==
              ["provenance_value_domain_invalid:claude-code:role:single_digit:32"])
          '

      - name: Type check
        run: npm run check

      - name: Docstring coverage gate
        run: npm run docstring

      - name: Test with coverage gate
        run: npm run coverage

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Verify package contents
        run: npm run pack:dry-run

      - name: Verify generated changelog is current
        run: npm run changelog:check

      - name: Verify the changelog date is derived from the version
        run: npm run verify:release-changelog-date

      - name: Verify every publish invocation is attested
        run: npm run verify:release-publish-attestation
